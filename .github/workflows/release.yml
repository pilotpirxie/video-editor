# Pushing a tag such as v0.1.0 builds the DMG on an Apple silicon runner and publishes it as a GitHub release,
# together with the sources of the bundled FFmpeg and its libraries, which their LGPL licences require next to the binary.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: |
            vendor/ffmpeg
            vendor/ffmpeg-sources
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.mjs') }}

      - name: Install the tools that build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install pkgconf cmake meson ninja autoconf automake libtool

      - run: npm ci

      # Electron fetches its binary on first use rather than at install, and the DMG copies Electron's licences from it.
      - run: npx install-electron

      - name: Build the DMG
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg vendor/ffmpeg-sources/* --title "Playback ${GITHUB_REF_NAME#v}" --generate-notes
