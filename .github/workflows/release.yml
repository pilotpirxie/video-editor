# Pushing a tag such as v0.1.0 builds the DMG on an Apple silicon runner and publishes it as a GitHub release,
# together with the source of the bundled FFmpeg, which its GPL licence requires next to the binary.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      FFMPEG_VERSION: 9.0.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      # The FFmpeg download site is not always up; once fetched, the pinned binaries come from the cache.
      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}

      - run: npm ci

      - name: Build the DMG
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Download the source of the bundled FFmpeg
        run: curl -fsSL -o "release/ffmpeg-${FFMPEG_VERSION}.tar.xz" "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg "release/ffmpeg-${FFMPEG_VERSION}.tar.xz" --title "Playback ${GITHUB_REF_NAME#v}" --generate-notes
