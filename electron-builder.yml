appId: com.opensource.playback
productName: Playback
copyright: "Copyright © 2026 pilotpirxie. Free software under the GNU GPL version 3 or later, with no warranty. Licences are in Playback.app/Contents/Resources/licenses."
directories:
  output: release
files:
  - package.json
  - dist/node/src/**
  - dist/renderer/**
  - "!**/*.test.js"
  - "!node_modules/**"
extraResources:
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg
      - ffprobe
  - from: vendor/ffmpeg/licenses
    to: licenses/ffmpeg
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/Chromium-LICENSES.html
  # React DOM and scheduler carry the same licence file as React.
  - from: node_modules/react/LICENSE
    to: licenses/React-LICENSE.txt
  - from: node_modules/vite/LICENSE.md
    to: licenses/Vite-LICENSE.txt
  - from: node_modules/rolldown/LICENSE
    to: licenses/Rolldown-LICENSE.txt
electronLanguages:
  - en
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.video
  icon: build/icon.png
  minimumSystemVersion: "15.0"
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
fileAssociations:
  - ext: pbproj
    name: Playback Project
    role: Editor
    rank: Owner
dmg:
  writeUpdateInfo: false
publish: null
