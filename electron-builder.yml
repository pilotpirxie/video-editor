appId: com.opensource.playback
productName: Playback
directories:
  output: release
files:
  - package.json
  - dist/node/src/**
  - dist/renderer/**
  - "!**/*.test.js"
  - "!node_modules/**"
extraResources:
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg
      - ffprobe
electronLanguages:
  - en
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.video
  icon: build/icon.png
  minimumSystemVersion: "15.0"
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: false
publish: null
